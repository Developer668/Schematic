<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#050505" />
    <link rel="icon" type="image/svg+xml" href="/schematic-favicon.svg" />
    <title>Schematic — Design Connected Hardware</title>
    <meta name="description" content="Plan connected hardware with real components, typed interfaces, editable source, project checks, and a reviewable parts workflow." />
    <meta property="og:title" content="Schematic — Design Connected Hardware" />

    <style>
      html, body, #root { min-height: 100%; margin: 0; background: #050505; }
    </style>
    <script>
      try {
        const theme = localStorage.getItem("schematic-theme");
        document.documentElement.className = theme === "light" ? "light" : "dark";
      } catch {
        document.documentElement.className = "dark";
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
