<?xml version="1.0" encoding="UTF-8"?>
<svg width="32" height="32" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="0.7" flood-color="#000" flood-opacity="0.28"/>
    </filter>
    <linearGradient id="bodyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.22"/>
    </linearGradient>
  </defs>
  <!-- leads aligned to side-pin positions: left VCC (33%) & IN (66%), right GND (50%) -->
  <rect x="0" y="9.8" width="6" height="1.7" rx="0.5" fill="#c8c8c8" stroke="#8a8a8a" stroke-width="0.25"/>
  <rect x="0" y="19.9" width="6" height="1.7" rx="0.5" fill="#c8c8c8" stroke="#8a8a8a" stroke-width="0.25"/>
  <rect x="26" y="14.8" width="6" height="1.7" rx="0.5" fill="#c8c8c8" stroke="#8a8a8a" stroke-width="0.25"/>
  <!-- body: black cylindrical piezo -->
  <ellipse cx="16" cy="15.5" rx="10.5" ry="10.5" fill="#0f1115" stroke="#1f2937" stroke-width="0.5" filter="url(#softShadow)"/>
  <ellipse cx="16" cy="15.5" rx="10.5" ry="10.5" fill="url(#bodyGrad)" opacity="0.22"/>
  <ellipse cx="16" cy="15.5" rx="8.2" ry="8.2" fill="#1e2330" stroke="#2a3447" stroke-width="0.35"/>
  <ellipse cx="16" cy="15.5" rx="5.8" ry="5.8" fill="#0a0d14" stroke="#1e293b" stroke-width="0.3"/>
  <!-- piezo disc -->
  <circle cx="16" cy="15.5" r="2.6" fill="#d4af37" stroke="#8a6d1b" stroke-width="0.25"/>
  <circle cx="16" cy="15.5" r="0.9" fill="#fef3c7"/>
  <!-- sound holes -->
  <circle cx="13.2" cy="12.8" r="0.55" fill="#111827" stroke="#374151" stroke-width="0.15"/>
  <circle cx="16" cy="11.9" r="0.55" fill="#111827" stroke="#374151" stroke-width="0.15"/>
  <circle cx="18.8" cy="12.8" r="0.55" fill="#111827" stroke="#374151" stroke-width="0.15"/>
  <circle cx="19.7" cy="15.5" r="0.55" fill="#111827" stroke="#374151" stroke-width="0.15"/>
  <circle cx="18.8" cy="18.2" r="0.55" fill="#111827" stroke="#374151" stroke-width="0.15"/>
  <circle cx="16" cy="19.1" r="0.55" fill="#111827" stroke="#374151" stroke-width="0.15"/>
  <circle cx="13.2" cy="18.2" r="0.55" fill="#111827" stroke="#374151" stroke-width="0.15"/>
  <circle cx="12.3" cy="15.5" r="0.55" fill="#111827" stroke="#374151" stroke-width="0.15"/>
  <!-- side notch for + -->
  <text x="16" y="27.5" text-anchor="middle" font-family="monospace" font-size="2.2" font-weight="700" fill="#9ca3af">+</text>
</svg>
